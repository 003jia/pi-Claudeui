<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="light">
  <title>Pi</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="composer.css">
  <link rel="stylesheet" href="inspector.css">
  <link rel="stylesheet" href="settings.css">
  <script src="marked.umd.js" defer></script>
  <script src="format.js" defer></script>
  <script src="inspector.js" defer></script>
  <script src="context.js" defer></script>
  <script src="composer.js" defer></script>
  <script src="settings.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button type="button" id="hide-sidebar" class="icon-button" aria-label="收起侧栏" title="收起侧栏" data-icon="panel"></button>
    <button type="button" id="show-sidebar" class="icon-button" aria-label="展开侧栏" title="展开侧栏" data-icon="panel" hidden></button>
    <span id="conversation-title">新对话</span>
    <div class="topbar-actions">
      <button type="button" id="open-settings-collapsed" class="icon-button" aria-label="设置" title="设置" aria-haspopup="dialog" data-icon="settings" hidden></button>
      <button type="button" id="show-inspector" class="text-button inspector-button" aria-expanded="false" aria-controls="inspector">
        <span data-icon="panelRight" aria-hidden="true"></span>会话详情
      </button>
    </div>
  </header>
  <div class="app" id="layout">
    <aside class="sidebar" id="sidebar" aria-label="会话侧栏">
      <div class="sidebar-top">
        <span class="wordmark">Pi</span>
      </div>
      <button type="button" id="new-chat" class="new-chat">
        <span class="new-chat-icon" data-icon="plus" aria-hidden="true"></span>
        <span>新建对话</span>
        <kbd>⌘N</kbd>
      </button>
      <div class="recent">
        <h2 id="recent-title">最近会话</h2>
        <nav id="history" aria-labelledby="recent-title"></nav>
        <p class="history-empty" id="history-empty" hidden>暂无会话</p>
      </div>
      <div class="sidebar-footer">
        <button type="button" id="open-settings" class="settings-launch" aria-haspopup="dialog">
          <span data-icon="settings" aria-hidden="true"></span>
          设置
          <kbd>⌘,</kbd>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="workspace" id="workspace" data-empty="true">
        <div class="welcome" id="welcome">
          <span class="pi-mark" aria-hidden="true">π</span>
          <h1>今天想做什么？</h1>
        </div>
        <section class="transcript" id="transcript" aria-label="对话" tabindex="0" hidden>
          <div class="messages" id="messages"></div>
        </section>
        <div class="composer-dock">
          <form class="composer" id="composer">
            <div class="attachments" id="attachments" hidden></div>
            <label class="screen-reader-only" for="prompt">给 Pi 发消息</label>
            <textarea id="prompt" placeholder="给 Pi 发消息…" rows="2" spellcheck="false" aria-describedby="prompt-shortcut"></textarea>
            <span id="prompt-shortcut" class="screen-reader-only">回车发送，Shift 加回车换行。</span>
            <div class="composer-toolbar">
              <button type="button" id="attach" class="icon-button attach" aria-label="添加图片或文件" title="添加图片或文件" data-icon="plus"></button>
              <button type="button" id="folder" class="text-button folder" aria-label="选择工作目录">
                <span data-icon="folder" aria-hidden="true"></span>
                <span class="button-label" id="folder-label">工作目录</span>
                <span data-icon="chevron" aria-hidden="true"></span>
              </button>
              <div class="model-picker">
                <button type="button" id="model" class="text-button model" aria-haspopup="true" aria-expanded="false" aria-controls="model-menu">
                  <span class="button-label" id="model-label">正在连接…</span>
                  <span data-icon="chevron" aria-hidden="true"></span>
                </button>
                <div class="model-menu" id="model-menu" hidden>
                  <label class="screen-reader-only" for="model-filter">搜索模型</label>
                  <input id="model-filter" type="search" placeholder="搜索模型" autocomplete="off">
                  <div id="model-options" class="model-options" aria-label="可用模型"></div>
                </div>
              </div>
              <div class="composer-picker">
                <button type="button" id="thinking-depth" class="text-button composer-option" aria-haspopup="true" aria-expanded="false" aria-controls="thinking-menu" disabled>
                  <span id="thinking-label">深度 —</span><span data-icon="chevron" aria-hidden="true"></span>
                </button>
                <div class="composer-popover thinking-menu" id="thinking-menu" hidden>
                  <h2>思考深度</h2>
                  <div id="thinking-options"></div>
                </div>
              </div>
              <div class="composer-picker">
                <button type="button" id="tool-mode" class="text-button composer-option" aria-haspopup="true" aria-expanded="false" aria-controls="mode-menu" disabled>
                  <span id="tool-mode-label">模式 —</span><span data-icon="chevron" aria-hidden="true"></span>
                </button>
                <div class="composer-popover mode-menu" id="mode-menu" hidden>
                  <h2>权限模式</h2>
                  <div id="mode-options"></div>
                </div>
              </div>
              <div class="composer-picker">
                <button type="button" id="context-usage" class="text-button context-button" aria-haspopup="true" aria-expanded="false" aria-controls="context-menu">
                  <span class="context-track" aria-hidden="true"><span class="context-fill" id="context-fill"></span></span>
                  <span id="context-percent">—</span>
                </button>
                <div class="composer-popover context-menu" id="context-menu" hidden>
                  <div class="context-heading">
                    <h2>上下文窗口</h2>
                    <span id="context-total"></span>
                  </div>
                  <div class="context-track context-stack" id="context-detail-bar" aria-hidden="true"></div>
                  <dl class="context-rows" id="context-rows"></dl>
                  <div id="context-groups"></div>
                  <div class="context-actions">
                    <p class="context-caption" id="context-message"></p>
                    <button type="button" class="secondary-button" id="compact-session" disabled>压缩会话</button>
                  </div>
                  <div class="context-footer">
                    <button type="button" class="secondary-button" id="show-context-details">查看详情</button>
                    <span>分项为估算</span>
                  </div>
                </div>
              </div>
              <button id="send" type="submit" class="send" aria-label="发送" title="发送" data-icon="up" disabled></button>
            </div>
          </form>
          <div class="feedback" id="feedback" hidden>
            <span id="feedback-text" role="status"></span>
            <button type="button" id="reconnect" class="button-link" hidden>重新连接</button>
          </div>
        </div>
      </div>
    </main>
    <aside class="inspector" id="inspector" aria-labelledby="inspector-title" hidden>
      <div class="inspector-resizer" id="inspector-resizer" role="separator" aria-orientation="vertical" aria-label="调整会话详情宽度" aria-controls="inspector" aria-valuemin="232" aria-valuemax="420" aria-valuenow="306" tabindex="0"></div>
      <header class="inspector-header">
        <h2 id="inspector-title">会话详情</h2>
        <button type="button" id="hide-inspector" class="icon-button" aria-label="关闭会话详情" title="关闭会话详情" data-icon="close"></button>
      </header>
      <div class="inspector-body">
        <section>
          <h3>执行环境</h3>
          <p class="inspector-folder"><span data-icon="folder" aria-hidden="true"></span><span id="inspector-folder"></span></p>
          <p class="inspector-caption">工作目录</p>
          <p class="inspector-path" id="inspector-path"></p>
          <button type="button" class="inspector-file-button" id="reveal-workspace">文件</button>
        </section>
        <section>
          <h3>文件改动</h3>
          <div class="inspector-files" id="inspector-changes"></div>
        </section>
        <section>
          <h3>交付物</h3>
          <div class="inspector-files" id="inspector-deliverables"></div>
        </section>
        <section id="inspector-context" tabindex="-1">
          <div class="inspector-context-heading"><h3>上下文</h3><span id="inspector-context-percent">—</span></div>
          <div class="context-track context-stack" id="inspector-context-bar" aria-hidden="true"></div>
          <dl class="context-rows" id="inspector-context-rows"></dl>
          <div id="inspector-context-groups"></div>
        </section>
      </div>
    </aside>
  </div>

  <dialog id="settings" class="settings-dialog" aria-labelledby="settings-title">
    <header class="settings-header">
      <h2 id="settings-title">设置</h2>
      <button type="button" class="icon-button" id="settings-close" aria-label="关闭设置" title="关闭设置" data-icon="close" autofocus></button>
    </header>
    <div class="settings-layout">
      <nav class="settings-nav" aria-label="设置分类">
        <div class="settings-search">
          <span data-icon="search" aria-hidden="true"></span>
          <input id="settings-search" type="search" aria-label="搜索设置" placeholder="搜索设置" autocomplete="off">
        </div>
        <p class="settings-group" id="settings-preferences">偏好设置</p>
        <ul aria-labelledby="settings-preferences">
          <li><button type="button" data-settings-page="general" aria-current="page"><span data-icon="settings" aria-hidden="true"></span>常规</button></li>
          <li><button type="button" data-settings-page="appearance"><span data-icon="appearance" aria-hidden="true"></span>外观</button></li>
          <li><button type="button" data-settings-page="model"><span data-icon="code" aria-hidden="true"></span>模型</button></li>
        </ul>
        <p class="settings-group" id="settings-device">这台电脑</p>
        <ul aria-labelledby="settings-device">
          <li><button type="button" data-settings-page="computer"><span data-icon="computer" aria-hidden="true"></span>本机</button></li>
        </ul>
      </nav>
      <div class="settings-content" id="settings-content">
        <p id="settings-feedback" class="settings-feedback" role="status" hidden></p>
        <section data-settings-panel="general" aria-labelledby="settings-general-title">
          <h3 id="settings-general-title">交互</h3>
          <div class="setting-row" data-setting>
            <div>
              <p id="send-key-title" class="setting-label">发送快捷键</p>
              <p class="setting-description">选择用哪个按键发送消息。</p>
            </div>
            <div class="settings-segment" role="group" aria-labelledby="send-key-title">
              <label><input type="radio" name="sendShortcut" value="enter" data-preference="sendShortcut" checked><span>回车</span></label>
              <label><input type="radio" name="sendShortcut" value="command-enter" data-preference="sendShortcut"><span>⌘ + 回车</span></label>
            </div>
          </div>
          <div class="setting-row" data-setting>
            <div>
              <label class="setting-label" for="startup-sidebar">启动时展开侧栏</label>
              <p class="setting-description">打开 Pi 时显示最近会话。</p>
            </div>
            <div class="settings-switch">
              <input id="startup-sidebar" type="checkbox" role="switch" data-preference="sidebarOnLaunch" checked>
              <span aria-hidden="true"></span>
            </div>
          </div>
        </section>
        <section data-settings-panel="appearance" aria-labelledby="settings-appearance-title" hidden>
          <h3 id="settings-appearance-title">对话外观</h3>
          <div class="setting-row" data-setting>
            <div>
              <label for="reply-font" class="setting-label">回复字体</label>
              <p class="setting-description">应用于 Pi 的回复正文。</p>
            </div>
            <div class="setting-select">
              <select id="reply-font" data-preference="replyFont">
                <option value="serif">默认字体</option>
                <option value="system">系统字体</option>
              </select>
              <span data-icon="chevron" aria-hidden="true"></span>
            </div>
          </div>
          <div class="setting-row" data-setting>
            <div>
              <label for="chat-width" class="setting-label">对话宽度</label>
              <p class="setting-description">调整消息和输入框的最大宽度。</p>
            </div>
            <div class="setting-select">
              <select id="chat-width" data-preference="chatWidth">
                <option value="compact">紧凑</option>
                <option value="standard" selected>标准</option>
                <option value="wide">宽幅</option>
              </select>
              <span data-icon="chevron" aria-hidden="true"></span>
            </div>
          </div>
          <div class="setting-row" data-setting>
            <div>
              <label for="code-size" class="setting-label">代码字号</label>
              <p class="setting-description">应用于代码块和工具输出。</p>
            </div>
            <div class="setting-select">
              <select id="code-size" data-preference="codeSize">
                <option value="12">默认（12 px）</option>
                <option value="14">14 px</option>
                <option value="16">16 px</option>
              </select>
              <span data-icon="chevron" aria-hidden="true"></span>
            </div>
          </div>
        </section>
        <section data-settings-panel="model" aria-labelledby="settings-model-title" hidden>
          <h3 id="settings-model-title">当前会话</h3>
          <p id="settings-engine-status" class="setting-description" hidden></p>
          <div class="setting-row" data-setting>
            <div>
              <label for="settings-model" class="setting-label">模型</label>
              <p class="setting-description">从本机 Pi 已配置的模型中选择。</p>
            </div>
            <div class="setting-select">
              <select id="settings-model" disabled></select>
              <span data-icon="chevron" aria-hidden="true"></span>
            </div>
          </div>
          <div class="setting-row" data-setting>
            <div>
              <label for="settings-thinking" class="setting-label">思考强度</label>
              <p class="setting-description">可选级别取决于当前模型。</p>
            </div>
            <div class="setting-select">
              <select id="settings-thinking" disabled></select>
              <span data-icon="chevron" aria-hidden="true"></span>
            </div>
          </div>
        </section>
        <section data-settings-panel="computer" aria-labelledby="settings-computer-title" hidden>
          <h3 id="settings-computer-title">工作区</h3>
          <div class="setting-row" data-setting>
            <div>
              <p class="setting-label">当前工作目录</p>
              <p class="setting-description settings-path" id="settings-folder-path"></p>
            </div>
            <button type="button" class="settings-action" id="settings-folder" aria-label="更改工作目录">更改…</button>
          </div>
          <div class="setting-row" data-setting>
            <div>
              <p class="setting-label">会话存储位置</p>
              <p class="setting-description settings-path" id="settings-session-path"></p>
            </div>
            <button type="button" class="settings-action" id="settings-reveal">在访达中显示</button>
          </div>
        </section>
        <p id="settings-no-results" class="settings-empty" role="status" hidden>没有匹配的设置</p>
      </div>
    </div>
  </dialog>

  <dialog class="extension-dialog" id="extension-dialog" aria-labelledby="dialog-title" aria-describedby="dialog-text">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <div id="dialog-options"></div>
      <div class="dialog-footer">
        <button type="submit" value="cancel" class="secondary-button">取消</button>
        <button type="submit" value="ok" class="primary-button">确定</button>
      </div>
    </form>
  </dialog>
</body>
</html>
